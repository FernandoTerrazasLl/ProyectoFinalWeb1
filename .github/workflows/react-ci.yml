name: react-ci

on:
  push:
    branches: [main]
    paths:
      - "code/react/**"
      - ".github/workflows/react-ci.yml"
  pull_request:
    paths:
      - "code/react/**"
      - ".github/workflows/react-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/react/package-lock.json
      - run: npm ci
      - run: npm run validate
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: react-coverage-html
          path: code/react/coverage
