services:
  postgres:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private_network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-curamente_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M

  admin:
    build:
      context: ./code/admin
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./code/admin:/app
    networks:
      - private_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build:
      context: ./code/backend
    env_file:
      - .env
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --workers 2 --proxy-headers --forwarded-allow-ips="*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./code/backend:/app
    networks:
      - private_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  worker-etl:
    build:
      context: ./code/admin
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./code/admin:/app
    networks:
      - private_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 384M

  worker-ugc:
    build:
      context: ./code/backend
    command: python -m src.services.kafka_consumer
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_started
      mongodb:
        condition: service_healthy
      clickhouse:
        condition: service_started
    volumes:
      - ./code/backend:/app
    networks:
      - private_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 384M

  frontend:
    build:
      context: ./code/frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_OAUTH_CLIENT_ID: ${VITE_OAUTH_CLIENT_ID}
    networks:
      - private_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - private_network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1.5G

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - private_network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  mongodb:
    image: mongo:6-jammy
    volumes:
      - mongodb_data:/data/db
    networks:
      - private_network
    restart: always
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - private_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - private_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 768M

  proxy:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /etc/ssl/certs:/etc/ssl/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - admin
      - backend
    networks:
      - public_network
      - private_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
  elasticsearch_data:
  redis_data:
  mongodb_data:
  kafka_data:
  clickhouse_data:

networks:
  public_network:
    driver: bridge
  private_network:
    internal: true
    driver: bridge
