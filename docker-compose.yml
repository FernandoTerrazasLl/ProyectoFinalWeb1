services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private_network
    restart: always

  admin:
    build:
      context: ./code/admin
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - private_network
    restart: always

  backend:
    build:
      context: ./code/backend
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - private_network
    restart: always

  frontend:
    build:
      context: ./code/frontend
    networks:
      - private_network
    restart: always

  proxy:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - admin
      - backend
    networks:
      - public_network
      - private_network
    restart: always

volumes:
  postgres_data:

networks:
  public_network:
    driver: bridge
  private_network:
    internal: true
    driver: bridge
