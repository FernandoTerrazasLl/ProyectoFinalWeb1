services:
  postgres:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private_network
    restart: always

  admin:
    build:
      context: ./code/admin
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - ./code/admin:/app
    networks:
      - private_network
    restart: always

  backend:
    build:
      context: ./code/backend
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - ./code/backend:/app
    networks:
      - private_network
    restart: always

  worker-etl:
    build:
      context: ./code/admin
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./code/admin:/app
    networks:
      - private_network
    restart: always

  worker-ugc:
    build:
      context: ./code/backend
    command: python -m src.workers.kafka_consumer
    env_file:
      - .env
    depends_on:
      - kafka
      - mongodb
      - clickhouse
    volumes:
      - ./code/backend:/app
    networks:
      - private_network
    restart: always

  frontend:
    build:
      context: ./code/frontend
    volumes:
      - ./code/frontend:/app
    networks:
      - private_network
    restart: always

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - private_network
    restart: always

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - private_network
    restart: always

  mongodb:
    image: mongo:6-jammy
    volumes:
      - mongodb_data:/data/db
    networks:
      - private_network
    restart: always

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - private_network
    restart: always

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - private_network
    restart: always

  proxy:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - admin
      - backend
    networks:
      - public_network
      - private_network
    restart: always

volumes:
  postgres_data:
  elasticsearch_data:
  redis_data:
  mongodb_data:
  kafka_data:
  clickhouse_data:

networks:
  public_network:
    driver: bridge
  private_network:
    internal: true
    driver: bridge
