worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # BLOQUE 1: Redirige todo el tráfico HTTP (puerto 80) a HTTPS (puerto 443)
    server {
        listen 80;
        server_name fernandotll.dev www.fernandotll.dev;
        return 301 https://$host$request_uri;
    }

    # BLOQUE 2: Servidor principal seguro con SSL
    server {
        listen 443 ssl;
        server_name fernandotll.dev www.fernandotll.dev;

        # Certificados SSL
        ssl_certificate /etc/letsencrypt/live/fernandotll.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fernandotll.dev/privkey.pem;

        # Opciones recomendadas de SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Frontend React/Vite App
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django Admin Panel
        location /admin/ {
            proxy_pass http://admin:8080/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FastAPI Backend (Necesario para Google Auth)
        location /api/ {
            proxy_pass http://backend:8001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # CABECERAS CRÍTICAS PARA OAUTH Y SEGURIDAD
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # Django Static Files
        location /static/ {
            proxy_pass http://admin:8080/static/;
            proxy_set_header Host $host;
        }
    }
}
